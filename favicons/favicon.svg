<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe6a7"/>
      <stop offset="50%" stop-color="#dfa855"/>
      <stop offset="100%" stop-color="#977b45"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b86d75"/>
      <stop offset="100%" stop-color="#8b4a51"/>
    </linearGradient>
  </defs>
  <!-- Background badge -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)"/>
  <circle cx="32" cy="32" r="28" fill="none" stroke="#dfa855" stroke-width="1" opacity="0.5"/>
  <!-- Golden Ring band -->
  <circle cx="32" cy="37" r="14.5" fill="none" stroke="url(#ringGrad)" stroke-width="4.5"/>
  <!-- Diamond gem on top of the ring -->
  <polygon points="32,12 39,21 32,26 25,21" fill="#ffffff"/>
  <polygon points="32,12 39,21 32,21" fill="#dbeafe"/>
  <polygon points="32,12 25,21 32,21" fill="#93c5fd"/>
  <!-- Facet lines -->
  <polyline points="25,21 32,26 39,21" fill="none" stroke="#60a5fa" stroke-width="0.8" opacity="0.6"/>
  <!-- Sparkles -->
  <path d="M45,13 L46,16 L49,17 L46,18 L45,21 L44,18 L41,17 L44,16 Z" fill="#ffffff"/>
  <path d="M19,23 L19.7,25 L21.7,25.7 L19.7,26.4 L19,28.4 L18.3,26.4 L16.3,25.7 L18.3,25 Z" fill="#ffffff" opacity="0.85"/>
</svg>
